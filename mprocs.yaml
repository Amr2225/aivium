procs: 
  inngest:
    cmd: ["npm.cmd", "run", "inngest"]
    stop: "hard-kill"

  next: 
    cmd: ["npm.cmd", "run", "dev"]
    stop: "hard-kill"

  prisma:
    cmd: ["npm.cmd", "run", "studio"]
    stop: "hard-kill"

